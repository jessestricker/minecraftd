name: Build
on:
  pull_request:
  workflow_call:
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minecraftd
          path: minecraftd

  package:
    name: Package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download build output
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: minecraftd
      - name: Package
        run: |
          mkdir --parents package/usr/local/bin/
          cp minecraftd package/usr/local/bin/
          mkdir --parents package/usr/local/lib/systemd/system/
          cp minecraft.service package/usr/local/lib/systemd/system/
          pushd package/ && zip -r ../package.zip . && popd
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package.zip
          path: package.zip
