name: Build
on:
  pull_request:
  workflow_call:
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -v
      - name: Package
        run: |
          install -D minecraftd package/usr/local/bin/minecraftd
          install -D minecraft.service package/usr/local/lib/systemd/system/minecraft.service
          tar -czvvf package.tar.gz -C package/ .
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package.tar.gz
          path: package.tar.gz
